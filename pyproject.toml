[build-system]
# 77.0.3 is the first release that accepts the PEP 639 SPDX license expression
# below; older versions reject the string form of `license`.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pawnlogic-security"
dynamic = ["version"]
description = "Scope-gated security tooling for the PawnLogic agent host"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PawnLogic Contributors" }]
keywords = ["pawnlogic", "security", "extension", "reconnaissance"]
# The deprecated "License :: OSI Approved" classifier is intentionally absent;
# the SPDX expression above is the single declaration.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# The host owns the Extension contracts this package implements, so the
# supported core range is narrow on purpose.
dependencies = ["pawnlogic>=0.3,<0.4"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-timeout>=2.1",
    "ruff>=0.5",
    "mypy>=1.8",
]

[project.scripts]
pawn-security = "pawnlogic_security.cli:main"

# Discovery reads this group without importing the module behind it.
[project.entry-points."pawnlogic.extensions"]
security = "pawnlogic_security.extension:build_extension"

[project.urls]
Homepage = "https://github.com/john0123412/pawnlogic-security"
Issues = "https://github.com/john0123412/pawnlogic-security/issues"

[tool.setuptools]
packages = ["pawnlogic_security"]

[tool.setuptools.dynamic]
version = { attr = "pawnlogic_security.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["pawnlogic_security"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The core is not typed as a distributed stub package.
[[tool.mypy.overrides]]
module = ["core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--timeout=60"
